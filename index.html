<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Register</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#14181f;
    --panel:#1b212b;
    --panel-2:#212936;
    --line:#2c3441;
    --text:#dfe4ec;
    --muted:#8792a3;
    --brass:#c9a15f;
    --brass-dim:#8f7443;
    --good:#6fbf8f;
    --bad:#e07a6a;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @font-face{
    font-family:'Inter'; src:local('Inter'); font-display:swap;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--sans);
    font-size:13px;
  }
  ::selection{ background:var(--brass); color:#14181f; }

  /* ---------- shell ---------- */
  .shell{
    display:flex; flex-direction:column; height:100vh; height:100dvh;
  }

  /* ---------- header / drop strip ---------- */
  .topbar{
    flex:0 0 auto;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .titlerow{
    display:flex; align-items:baseline; gap:10px;
    padding:10px 14px 8px;
  }
  .titlerow h1{
    font-size:14px; font-weight:700; letter-spacing:.04em; margin:0;
    text-transform:uppercase; color:var(--text);
  }
  .titlerow .tag{
    font-family:var(--mono); font-size:10px; color:var(--brass);
    border:1px solid var(--brass-dim); border-radius:3px;
    padding:1px 5px; letter-spacing:.05em;
  }
  .titlerow .hint{
    margin-left:auto; font-size:11px; color:var(--muted);
  }

  .dropzone{
    margin:0 14px 10px; padding:10px 12px;
    border:1px dashed var(--line); border-radius:6px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer; transition:border-color .15s, background .15s;
    background:var(--panel-2);
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--brass); background:#232b38;
  }
  .dropzone.compact{ padding:6px 12px; }
  .dropzone .dz-icon{
    font-family:var(--mono); font-size:16px; color:var(--brass);
    width:20px; text-align:center; flex:0 0 auto;
  }
  .dropzone .dz-text{ flex:1 1 auto; min-width:0; }
  .dropzone .dz-text b{ color:var(--text); font-weight:600; }
  .dropzone .dz-text span{ color:var(--muted); font-size:11px; }
  .dropzone input[type=file]{ display:none; }

  /* ---------- stat strip ---------- */
  .stats{
    display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
    border-top:1px solid var(--line);
  }
  .stat{
    padding:7px 14px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:1px;
  }
  .stat:last-child{ border-right:none; }
  .stat .n{
    font-family:var(--mono); font-size:18px; font-weight:700; color:var(--brass);
    line-height:1.1; font-variant-numeric:tabular-nums;
  }
  .stat .l{
    font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:7px 14px; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .toolbar input[type=search]{
    flex:1 1 220px; max-width:320px;
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:4px; padding:5px 8px; font-size:12px; font-family:var(--sans);
  }
  .toolbar input[type=search]:focus{ outline:none; border-color:var(--brass); }
  .btn{
    font-family:var(--sans); font-size:11.5px; font-weight:600;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    padding:5px 10px; border-radius:4px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:border-color .15s, color .15s;
  }
  .btn:hover{ border-color:var(--brass); color:var(--brass); }
  .btn.primary{ background:var(--brass); color:#14181f; border-color:var(--brass); }
  .btn.primary:hover{ background:#d8ae6b; color:#14181f; }
  .btn.ghost{ color:var(--muted); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .toolbar .spacer{ flex:1 1 auto; }
  .toolbar .count{ font-size:11px; color:var(--muted); font-family:var(--mono); }

  /* ---------- progress ---------- */
  .progress-wrap{
    flex:0 0 auto; height:2px; background:var(--line); overflow:hidden;
  }
  .progress-bar{
    height:100%; width:0%; background:var(--brass); transition:width .2s;
  }

  /* ---------- table ---------- */
  .table-wrap{
    flex:1 1 auto; overflow:auto; background:var(--bg);
  }
  table{
    width:100%; border-collapse:collapse; font-size:12px;
  }
  thead th{
    position:sticky; top:0; z-index:2;
    background:var(--panel); color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; font-size:10px; font-weight:700;
    text-align:left; padding:7px 10px;
    border-bottom:1px solid var(--line); border-right:1px solid var(--line);
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  thead th:last-child{ border-right:none; }
  thead th:hover{ color:var(--brass); }
  thead th .arrow{ font-size:9px; margin-left:3px; opacity:.6; }
  thead th.num, tbody td.num{ text-align:right; }
  th.idx, td.idx{ text-align:center; width:34px; color:var(--muted); font-family:var(--mono); }

  tbody tr{ border-bottom:1px solid #202632; }
  tbody tr:nth-child(even){ background:#181d26; }
  tbody tr:hover{ background:#232b38; }
  tbody tr.err td{ color:var(--bad); }
  td{
    padding:5px 10px; border-right:1px solid #1f2530; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:1px;
  }
  td:last-child{ border-right:none; }
  td.name{ max-width:0; width:100%; }
  td.name .fn{ color:var(--text); }
  td.pages, td.size{ font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--text); }
  td.rm{ width:26px; text-align:center; }
  td.rm button{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px;
    line-height:1; padding:2px 4px; border-radius:3px;
  }
  td.rm button:hover{ color:var(--bad); background:#2a2130; }

  .empty{
    padding:40px 20px; text-align:center; color:var(--muted);
  }
  .empty .big{ font-family:var(--mono); font-size:28px; color:var(--line); margin-bottom:6px; }

  /* scrollbar */
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:#2c3441; border-radius:5px; }
  ::-webkit-scrollbar-thumb:hover{ background:#3a4353; }

  @media (max-width:640px){
    .stats{ grid-auto-flow:row; grid-template-columns:repeat(2,1fr); }
    .stat{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
    .titlerow .hint{ display:none; }
    td.size{ display:none; }
    th.size{ display:none; }
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="titlerow">
      <h1>PDF Register</h1>
      <span class="tag">v2</span>
      <span class="hint">Drop PDFs anywhere on the page · click a column to sort</span>
    </div>

    <label class="dropzone" id="dropzone">
      <span class="dz-icon">⇩</span>
      <span class="dz-text"><b>Drop PDF files here</b> <span>or click to browse — any number of files, processed locally in your browser</span></span>
      <input type="file" id="files" accept=".pdf" multiple>
    </label>

    <div class="stats">
      <div class="stat"><span class="n" id="statFiles">0</span><span class="l">Files</span></div>
      <div class="stat"><span class="n" id="statPages">0</span><span class="l">Total Pages</span></div>
      <div class="stat"><span class="n" id="statAvg">0</span><span class="l">Avg Pages / File</span></div>
      <div class="stat"><span class="n" id="statSize">0 KB</span><span class="l">Total Size</span></div>
      <div class="stat"><span class="n" id="statErr">0</span><span class="l">Failed</span></div>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Filter by file name…">
    <span class="count" id="visibleCount"></span>
    <div class="spacer"></div>
    <button class="btn ghost" id="clearBtn">Clear all</button>
    <button class="btn" id="csvBtn">Export CSV</button>
    <button class="btn primary" id="xlsBtn">Export Excel</button>
  </div>

  <div class="table-wrap">
    <table id="pdfTable">
      <thead>
        <tr>
          <th class="idx">#</th>
          <th data-key="fileName">File name <span class="arrow"></span></th>
          <th class="num" data-key="numPages">Pages <span class="arrow"></span></th>
          <th class="num size" data-key="fileSize">Size (KB) <span class="arrow"></span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyState">
      <div class="big">∅</div>
      No files loaded yet — drop PDFs above to build the register.
    </div>
  </div>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

const state = { rows: [], sortKey: null, sortDir: 1, filter: '' };

const el = id => document.getElementById(id);
const dropzone = el('dropzone');
const fileInput = el('files');
const tbody = el('tbody');
const progressBar = el('progressBar');
const emptyState = el('emptyState');
const table = el('pdfTable');

let queueTotal = 0, queueDone = 0;

function handleFiles(fileList){
  const files = Array.from(fileList).filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if(!files.length) return;
  queueTotal += files.length;
  dropzone.classList.add('compact');
  files.forEach(readFile);
}

function readFile(file){
  const row = {
    id: Math.random().toString(36).slice(2),
    fileName: file.name,
    numPages: null,
    fileSize: +(file.size/1024).toFixed(2),
    status: 'loading'
  };
  state.rows.push(row);
  render();

  const reader = new FileReader();
  reader.onload = function(){
    const typedarray = new Uint8Array(this.result);
    pdfjsLib.getDocument(typedarray).promise.then(pdf => {
      row.numPages = pdf.numPages;
      row.status = 'ok';
    }).catch(() => {
      row.numPages = 0;
      row.status = 'error';
    }).finally(() => {
      queueDone++;
      updateProgress();
      render();
    });
  };
  reader.onerror = function(){
    row.numPages = 0;
    row.status = 'error';
    queueDone++;
    updateProgress();
    render();
  };
  reader.readAsArrayBuffer(file);
}

function updateProgress(){
  const pct = queueTotal ? Math.round((queueDone/queueTotal)*100) : 0;
  progressBar.style.width = pct + '%';
  if(queueDone >= queueTotal){
    setTimeout(() => { progressBar.style.width = '0%'; queueTotal = 0; queueDone = 0; }, 400);
  }
}

function removeRow(id){
  state.rows = state.rows.filter(r => r.id !== id);
  render();
}

function sortBy(key){
  if(state.sortKey === key){ state.sortDir *= -1; }
  else { state.sortKey = key; state.sortDir = 1; }
  render();
}

function getSorted(){
  let rows = state.rows.filter(r => r.fileName.toLowerCase().includes(state.filter.toLowerCase()));
  if(state.sortKey){
    const k = state.sortKey, d = state.sortDir;
    rows = rows.slice().sort((a,b) => {
      let av = a[k], bv = b[k];
      if(k === 'fileName'){ av = av.toLowerCase(); bv = bv.toLowerCase(); return av.localeCompare(bv)*d; }
      return ((av ?? -1) - (bv ?? -1)) * d;
    });
  }
  return rows;
}

function render(){
  const rows = getSorted();
  tbody.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    if(r.status === 'error') tr.classList.add('err');
    const pagesDisplay = r.status === 'loading' ? '…' : (r.status === 'error' ? 'failed' : r.numPages);
    tr.innerHTML = `
      <td class="idx">${i+1}</td>
      <td class="name" title="${escapeHtml(r.fileName)}"><span class="fn">${escapeHtml(r.fileName)}</span></td>
      <td class="num pages">${pagesDisplay}</td>
      <td class="num size">${r.fileSize.toFixed(2)}</td>
      <td class="rm"><button title="Remove" data-id="${r.id}">✕</button></td>
    `;
    tbody.appendChild(tr);
  });

  emptyState.style.display = state.rows.length ? 'none' : 'block';
  table.style.display = state.rows.length ? 'table' : 'none';

  el('visibleCount').textContent = state.filter ? `${rows.length} / ${state.rows.length} shown` : '';

  // stats
  const ok = state.rows.filter(r => r.status === 'ok');
  const errCount = state.rows.filter(r => r.status === 'error').length;
  const totalPages = ok.reduce((s,r) => s + (r.numPages||0), 0);
  const totalSizeKB = state.rows.reduce((s,r) => s + r.fileSize, 0);
  el('statFiles').textContent = state.rows.length;
  el('statPages').textContent = totalPages.toLocaleString();
  el('statAvg').textContent = ok.length ? (totalPages/ok.length).toFixed(1) : '0';
  el('statSize').textContent = formatSize(totalSizeKB);
  el('statErr').textContent = errCount;

  // sort arrows
  document.querySelectorAll('th[data-key]').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if(th.dataset.key === state.sortKey){
      arrow.textContent = state.sortDir === 1 ? '▲' : '▼';
    } else {
      arrow.textContent = '';
    }
  });
}

function formatSize(kb){
  if(kb > 1024*1024) return (kb/1024/1024).toFixed(2) + ' GB';
  if(kb > 1024) return (kb/1024).toFixed(2) + ' MB';
  return kb.toFixed(2) + ' KB';
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// events
fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value = ''; });

['dragenter','dragover'].forEach(evt => document.body.addEventListener(evt, e => {
  e.preventDefault(); dropzone.classList.add('drag');
}));
['dragleave','drop'].forEach(evt => document.body.addEventListener(evt, e => {
  e.preventDefault();
  if(evt === 'drop'){
    dropzone.classList.remove('drag');
    if(e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  } else if(e.target === document.body) {
    dropzone.classList.remove('drag');
  }
}));

tbody.addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if(btn) removeRow(btn.dataset.id);
});

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => sortBy(th.dataset.key));
});

el('search').addEventListener('input', e => { state.filter = e.target.value; render(); });

el('clearBtn').addEventListener('click', () => {
  if(state.rows.length && confirm('Clear all files from the register?')){
    state.rows = [];
    dropzone.classList.remove('compact');
    render();
  }
});

el('csvBtn').addEventListener('click', () => {
  const rows = getSorted();
  let csv = 'File Name,Pages,Size (KB)\n';
  rows.forEach(r => { csv += `"${r.fileName.replace(/"/g,'""')}",${r.numPages ?? ''},${r.fileSize}\n`; });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pdf-register.csv';
  a.click();
});

el('xlsBtn').addEventListener('click', () => {
  const rows = getSorted();
  const data = [['File Name','Pages','Size (KB)'], ...rows.map(r => [r.fileName, r.numPages ?? '', r.fileSize])];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:50},{wch:10},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'PDF Register');
  XLSX.writeFile(wb, 'pdf-register.xlsx');
});

render();
</script>
</body>
</html>
